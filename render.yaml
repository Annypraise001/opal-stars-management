services:
  - type: web
    name: opal-stars-management
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/opal.sqlite
      - key: PAYMENT_PROOF_DIRECTORY
        value: /tmp/payment-proofs
      - key: SESSION_SECRET
        generateValue: true